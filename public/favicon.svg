<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="pl" gradientUnits="userSpaceOnUse" x1="150" y1="890" x2="890" y2="150">
      <stop offset="0" stop-color="#FF0FA8"/>
      <stop offset="0.5" stop-color="#A85CF6"/>
      <stop offset="1" stop-color="#3EC9FF"/>
    </linearGradient>
  </defs>

  <!-- keydrill dark ground -->
  <rect x="32" y="32" width="960" height="960" rx="228" fill="#0d1117"/>

  <!-- keycap -->
  <rect x="218" y="198" width="470" height="470" rx="96" fill="none"
        stroke="url(#pl)" stroke-width="46" stroke-linejoin="round"/>

  <!-- circuit heart on the keycap face -->
  <path d="M453 540
           C 383 470 318 424 318 352
           C 318 300 358 264 404 264
           C 426 264 446 275 453 296
           C 460 275 480 264 502 264
           C 548 264 588 300 588 352
           C 588 424 523 470 453 540 Z"
        fill="none" stroke="url(#pl)" stroke-width="38"
        stroke-linejoin="round" stroke-linecap="round"/>

  <!-- traces out to ring pads, PriceLove style -->
  <line x1="688" y1="360" x2="800" y2="284" stroke="url(#pl)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="836" cy="260" r="42" fill="none" stroke="url(#pl)" stroke-width="38"/>

  <line x1="556" y1="668" x2="672" y2="784" stroke="url(#pl)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="706" cy="818" r="42" fill="none" stroke="url(#pl)" stroke-width="38"/>

  <line x1="352" y1="668" x2="352" y2="790" stroke="url(#pl)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="352" cy="826" r="42" fill="none" stroke="url(#pl)" stroke-width="38"/>
</svg>
